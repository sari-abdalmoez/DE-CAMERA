name: Build SARI Camera

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        if: ${{ hashFiles('native/rust/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Cache Rust dependencies
        if: ${{ hashFiles('native/rust/Cargo.toml') != '' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust

      - name: Install cargo-ndk
        if: ${{ hashFiles('native/rust/Cargo.toml') != '' }}
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build Rust native libraries
        if: ${{ hashFiles('native/rust/Cargo.toml') != '' }}
        working-directory: native/rust
        run: |
          set -e
          mkdir -p ../../app/src/main/jniLibs

          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../../app/src/main/jniLibs \
            build --release

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate Gradle installation
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew test --stacktrace --warning-mode all

      - name: Build Debug APK
        run: |
          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --warning-mode all \
            --no-daemon

      - name: Verify generated APK
        run: |
          set -e
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "No APK was generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SARI-Camera-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
