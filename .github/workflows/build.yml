name: Build SARI Camera

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build SARI Camera APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # INSTALL ANDROID COMPONENTS
      # =========================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"


      # =========================================================
      # VERIFY ANDROID
      # =========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"
          test -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          test -d "$ANDROID_SDK_ROOT/cmake/${CMAKE_VERSION}"

          echo ""
          echo "Android SDK components verified successfully."


      # =========================================================
      # NDK
      # =========================================================

      - name: Configure NDK
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"


      # =========================================================
      # RUST
      # =========================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi


      # =========================================================
      # RUST CACHE
      # =========================================================

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust


      # =========================================================
      # CARGO NDK
      # =========================================================

      - name: Install cargo-ndk
        shell: bash
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked


      # =========================================================
      # VERIFY TOOLCHAIN
      # =========================================================

      - name: Verify toolchain
        shell: bash
        run: |
          set -e

          java -version
          rustc --version
          cargo --version
          cargo ndk --version
          cmake --version

          echo ""
          echo "NDK:"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Make Gradle executable
        run: chmod +x ./gradlew


      - name: Verify Gradle
        run: ./gradlew --version


      # =========================================================
      # RUST TESTS
      # =========================================================

      - name: Run Rust tests
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        working-directory: rust
        run: |
          cargo test --all --verbose


      # =========================================================
      # BUILD RUST CORE
      # =========================================================

      - name: Build Rust core
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        working-directory: rust
        shell: bash
        run: |
          set -e

          mkdir -p ../app/src/main/jniLibs

          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../app/src/main/jniLibs \
            build --release


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "SARI CAMERA APK GENERATED SUCCESSFULLY"
          echo "========================================"
          echo ""
          echo "APK:"
          echo "$APK"
          echo ""

          ls -lh "$APK"


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SARI-Camera-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
