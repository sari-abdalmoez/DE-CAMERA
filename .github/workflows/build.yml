name: Build SARI Camera

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build SARI Camera APK
    runs-on: ubuntu-22.04   # ← غيّر من 24.04 إلى 22.04 (أكثر استقراراً)

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # JAVA 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # =========================================================
      # ANDROID SDK - تثبيت يدوي موثوق
      # =========================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          # إنشاء مجلدات SDK
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mkdir -p $ANDROID_HOME/platforms
          mkdir -p $ANDROID_HOME/build-tools
          mkdir -p $ANDROID_HOME/ndk
          mkdir -p $ANDROID_HOME/cmake

          # تحميل cmdline-tools
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          TMPFILE=$(mktemp)
          curl -fsSL "$CMDLINE_TOOLS_URL" -o "$TMPFILE"
          unzip -q "$TMPFILE" -d $ANDROID_HOME/cmdline-tools/latest
          rm "$TMPFILE"

          # نقل الملفات للمكان الصحيح
          mv $ANDROID_HOME/cmdline-tools/latest/cmdline-tools/* \
             $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || true

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          # تقبل التراخيص
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          # تثبيت المكونات
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"
          echo "✅ Android SDK verified"

      - name: Configure NDK
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # =========================================================
      # RUST
      # =========================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Verify toolchain
        shell: bash
        run: |
          java -version
          rustc --version
          cargo --version
          cargo ndk --version
          cmake --version

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Run Rust tests
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        working-directory: rust
        run: cargo test --all --verbose

      - name: Build Rust core
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        working-directory: rust
        shell: bash
        run: |
          set -e
          mkdir -p ../app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../app/src/main/jniLibs \
            build --release

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi
          echo "✅ APK: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SARI-Camera-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
