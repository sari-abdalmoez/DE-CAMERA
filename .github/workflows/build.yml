name: Build SARI Camera

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "27.2.12479018"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build SARI Camera APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1


      # =========================================================
      # VERIFY ANDROID
      # =========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"

          echo "Android SDK verification successful."


      # =========================================================
      # NDK
      # =========================================================

      - name: Configure NDK
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"


      # =========================================================
      # RUST
      # =========================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi


      # =========================================================
      # RUST CACHE
      # =========================================================

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust


      # =========================================================
      # CARGO NDK
      # =========================================================

      - name: Install cargo-ndk
        shell: bash
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked


      # =========================================================
      # VERIFY TOOLCHAIN
      # =========================================================

      - name: Verify toolchain
        shell: bash
        run: |
          java -version
          rustc --version
          cargo --version
          cargo ndk --version
          cmake --version
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Make Gradle executable
        run: chmod +x ./gradlew


      - name: Gradle version
        run: ./gradlew --version


      # =========================================================
      # RUST TESTS
      # =========================================================

      - name: Test Rust core
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        working-directory: rust
        run: |
          cargo test --all --verbose


      # =========================================================
      # BUILD RUST
      # =========================================================

      - name: Build Rust core
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        working-directory: rust
        shell: bash
        run: |
          set -e

          mkdir -p ../app/src/main/jniLibs

          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../app/src/main/jniLibs \
            build --release


      # =========================================================
      # BUILD ANDROID
      # =========================================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # =========================================================
      # VERIFY APK
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find app/build/outputs -type f -name "*.apk" -print

          APK="$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "SARI CAMERA APK GENERATED SUCCESSFULLY"
          echo "======================================"
          echo "$APK"
          ls -lh "$APK"


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SARI-Camera-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
