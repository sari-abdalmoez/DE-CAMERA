name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Configs safely
      run: |
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle
        echo 'rootProject.name = "DE-CAMERA"' >> settings.gradle
        echo "include ':app'" >> settings.gradle

        echo "plugins { id 'com.android.application' version '8.2.0' apply false }" > build.gradle

        mkdir -p app
        echo "plugins { id 'com.android.application' }" > app/build.gradle
        echo "android {" >> app/build.gradle
        echo "    namespace 'com.decamera.android'" >> app/build.gradle
        echo "    compileSdk 34" >> app/build.gradle
        echo "    defaultConfig { applicationId 'com.decamera.android'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }" >> app/build.gradle
        echo "    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }" >> app/build.gradle
        echo "}" >> app/build.gradle

        mkdir -p app/src/main
        echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.CAMERA"/><application android:label="DE-CAMERA"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DE-CAMERA-APK
        path: app/build/outputs/apk/debug/app-debug.apk
