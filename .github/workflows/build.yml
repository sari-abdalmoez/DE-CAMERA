name: SARI Camera Android Build
on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      JAVA_VERSION: '17'
      NDK_VERSION: '27.2.12479018'
      CMAKE_VERSION: '3.22.1'
      RUST_VERSION: '1.82.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: aarch64-linux-android,armv7-linux-androideabi
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Validate Rust core
        working-directory: native/rust
        run: cargo test --target x86_64-unknown-linux-gnu
      - name: Build Rust static library for Android
        working-directory: native/rust
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o ../../app/src/main/jniLibs build --release
      - name: Verify Rust artifacts
        run: test -f app/src/main/jniLibs/arm64-v8a/libsari_rust.a || (echo 'Rust static library missing' && exit 1)
      - name: Build and test APK
        run: gradle --no-daemon --stacktrace testDebug assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sari-camera-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload native build outputs (diagnostic)
        uses: actions/upload-artifact@v4
        with:
          name: sari-camera-native-diagnostics
          path: |
            app/build/intermediates/cxx/**
            native/rust/target/**/libsari_rust.a
          if-no-files-found: warn
