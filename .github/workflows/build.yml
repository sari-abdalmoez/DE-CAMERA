name: Build Android C++ APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # الخطوة الجديدة: تثبيت NDK و CMake يدوياً بدون استخدام الأداة التي تسبب الخطأ
    - name: Install NDK and CMake
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        
        # قبول التراخيص
        yes | sdkmanager --licenses || true
        
        # تثبيت NDK و CMake المطلوبين لمشروع C++
        sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Missing Gradle Files and Wrapper
      run: |
        # 1. إنشاء ملف settings.gradle إذا لم يكن موجوداً
        if [ ! -f "settings.gradle" ]; then
          echo "Creating settings.gradle..."
          cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DE-CAMERA"
        include ':app'
        EOF
        fi

        # 2. إنشاء ملف build.gradle الرئيسي إذا لم يكن موجوداً
        if [ ! -f "build.gradle" ]; then
          echo "Creating root build.gradle..."
          cat > build.gradle << 'EOF'
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'com.android.library' version '8.2.0' apply false
        }
        EOF
        fi

        # 3. توليد الـ Gradle Wrapper بإصدار متوافق
        echo "Generating Gradle Wrapper..."
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build APK with NDK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
