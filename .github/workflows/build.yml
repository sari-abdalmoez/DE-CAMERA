name: SARI Camera Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sari-camera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.31.6"

      - name: Toolchain diagnostics
        run: |
          java -version
          sdkmanager --version
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version || true
          cmake --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.82.0'
          targets: aarch64-linux-android

      - name: Configure Android Rust linker
        shell: bash
        run: |
          set -euxo pipefail
          rustup target add aarch64-linux-android
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          echo "CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          rustc --version
          cargo --version
          aarch64-linux-android24-clang --version

      - name: Download pinned OpenCV Android SDK
        env:
          OPENCV_URL: https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip
          OPENCV_SHA256: 464d55abe64b53af3aeb73197cf4620535abd909916d06e6a8b7c32712013966
        run: |
          set -euxo pipefail
          rm -rf third_party/opencv /tmp/opencv.zip /tmp/opencv-sdk
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "$OPENCV_URL" -o /tmp/opencv.zip
          echo "$OPENCV_SHA256  /tmp/opencv.zip" | sha256sum -c -
          mkdir -p /tmp/opencv-sdk third_party
          unzip -q /tmp/opencv.zip -d /tmp/opencv-sdk
          test -d /tmp/opencv-sdk/OpenCV-android-sdk
          mv /tmp/opencv-sdk/OpenCV-android-sdk third_party/opencv
          test -f third_party/opencv/sdk/native/jni/OpenCVConfig.cmake

      - name: Build Rust astro library
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo test --manifest-path app/src/main/rust/Cargo.toml
          cargo build --manifest-path app/src/main/rust/Cargo.toml --release --target aarch64-linux-android
          mkdir -p app/src/main/jniLibs/arm64-v8a
          test -f app/src/main/rust/target/aarch64-linux-android/release/libsari_astro.so
          cp app/src/main/rust/target/aarch64-linux-android/release/libsari_astro.so app/src/main/jniLibs/arm64-v8a/

      - name: Download and verify AI models
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/verify_model.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Build and test
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug --stacktrace --info

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sari-camera-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sari-camera-debug
          path: dist/sari-camera-debug.apk
          if-no-files-found: error
