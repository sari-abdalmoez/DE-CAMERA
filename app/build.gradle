plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.decamera'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.decamera"
        minSdk 24
        targetSdk 36

        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -O2"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
